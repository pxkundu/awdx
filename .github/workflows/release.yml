name: 🚀 AWDX Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.0.17)'
        required: true
        default: 'v0.0.17'
      force:
        description: 'Force release even if tag exists'
        required: false
        default: 'false'

env:
  PYTHON_VERSION: '3.8'
  PYTHON_VERSION_38: '3.8'
  PYTHON_VERSION_39: '3.9'
  PYTHON_VERSION_310: '3.10'
  PYTHON_VERSION_311: '3.11'
  PYTHON_VERSION_312: '3.12'
  PYTHON_VERSION_313: '3.13'

jobs:
  # Test all core functionality before release
  test:
    name: 🧪 Test Core Functionality
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, 3.10, 3.11, 3.12, 3.13]
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          
      - name: 🧪 Run security tests
        run: python tests/security_scanner.py --quick
        
      - name: 🧪 Run unit tests
        run: python tests/run_tests.py --unit --quick
        
      - name: 📊 Generate test coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term-missing
          
      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Build and test binary for each platform
  build-binary:
    name: 🔨 Build Binary - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
            binary_name: awdx-linux-x86_64
          - os: ubuntu-latest
            platform: linux
            arch: aarch64
            binary_name: awdx-linux-aarch64
          - os: macos-latest
            platform: macos
            arch: x86_64
            binary_name: awdx-macos-x86_64
          - os: macos-latest
            platform: macos
            arch: aarch64
            binary_name: awdx-macos-aarch64
          - os: windows-latest
            platform: windows
            arch: x86_64
            binary_name: awdx-windows-x86_64.exe
          - os: windows-latest
            platform: windows
            arch: aarch64
            binary_name: awdx-windows-aarch64.exe
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: 📦 Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[test]"
          
      - name: 🔨 Build binary with PyInstaller
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            pyinstaller --onefile --name awdx --distpath dist/ --workpath build/ src/awdx/__main__.py
          else
            pyinstaller --onefile --name awdx --distpath dist/ --workpath build/ src/awdx/__main__.py
          fi
          
      - name: 🧪 Test binary functionality
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            ./dist/awdx.exe --version
            ./dist/awdx.exe --help
          else
            chmod +x ./dist/awdx
            ./dist/awdx --version
            ./dist/awdx --help
          fi
          
      - name: 📝 Rename binary for release
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mv dist/awdx.exe dist/${{ matrix.binary_name }}
          else
            mv dist/awdx dist/${{ matrix.binary_name }}
          fi
          
      - name: 📤 Upload binary artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  # Build Python packages
  build-python:
    name: 🐍 Build Python Packages
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'
          
      - name: 📦 Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          
      - name: 🔨 Build package
        run: python -m build
        
      - name: 📤 Upload Python packages
        uses: actions/upload-artifact@v3
        with:
          name: python-packages
          path: dist/*.whl dist/*.tar.gz

  # Create GitHub release
  release:
    name: 🎉 Create Release
    runs-on: ubuntu-latest
    needs: [test, build-binary, build-python]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📋 Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
        
      - name: 📥 Download all binaries
        uses: actions/download-artifact@v3
        with:
          path: binaries/
          
      - name: 📥 Download Python packages
        uses: actions/download-artifact@v3
        with:
          name: python-packages
          path: python-packages/
          
      - name: 📝 Generate release notes
        id: release_notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          # 🚀 AWDX ${{ steps.get_version.outputs.VERSION }} Release
          
          ## 🎯 What's New
          
          ### ✨ New Features
          - Enhanced AI-powered natural language interface
          - Improved AWS DevSecOps automation capabilities
          - Better security scanning and compliance checking
          
          ### 🔧 Improvements
          - Performance optimizations across all modules
          - Enhanced error handling and user feedback
          - Updated dependencies for security and stability
          
          ### 🐛 Bug Fixes
          - Fixed various edge cases in profile management
          - Improved error messages and debugging information
          - Enhanced compatibility with different AWS regions
          
          ## 📦 Installation Options
          
          ### 🐍 Python Package (Recommended)
          \`\`\`bash
          pip install awdx
          \`\`\`
          
          ### 💻 Binary Downloads
          Choose the appropriate binary for your platform:
          
          **Linux:**
          - [awdx-linux-x86_64](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-linux-x86_64)
          - [awdx-linux-aarch64](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-linux-aarch64)
          
          **macOS:**
          - [awdx-macos-x86_64](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-macos-x86_64)
          - [awdx-macos-aarch64](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-macos-aarch64)
          
          **Windows:**
          - [awdx-windows-x86_64.exe](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-windows-x86_64.exe)
          - [awdx-windows-aarch64.exe](https://github.com/pxkundu/awdx/releases/download/${{ steps.get_version.outputs.VERSION }}/awdx-windows-aarch64.exe)
          
          ## 🚀 Quick Start
          
          After installation, run:
          \`\`\`bash
          awdx --help
          \`\`\`
          
          ## 📚 Documentation
          
          - [Full Documentation](https://github.com/pxkundu/awdx#readme)
          - [Installation Guide](https://github.com/pxkundu/awdx/blob/main/docs/INSTALLATION.md)
          - [Security Features](https://github.com/pxkundu/awdx/blob/main/docs/SECURITY.md)
          
          ## 🔒 Security
          
          This release has passed comprehensive security scanning and testing.
          
          ## 📊 Test Coverage
          
          - ✅ Security Tests: PASSED
          - ✅ Unit Tests: PASSED  
          - ✅ Integration Tests: PASSED
          - ✅ Code Quality: PASSED
          
          ## 🤝 Contributing
          
          We welcome contributions! Please see our [Contributing Guide](https://github.com/pxkundu/awdx/blob/main/CONTRIBUTING.md).
          
          ---
          
          **AWDX Team** | [GitHub](https://github.com/pxkundu/awdx) | [Issues](https://github.com/pxkundu/awdx/issues)
          EOF
          
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          name: AWDX ${{ steps.get_version.outputs.VERSION }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          files: |
            binaries/*/awdx*
            python-packages/*.whl
            python-packages/*.tar.gz
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish to PyPI
  publish-pypi:
    name: 📦 Publish to PyPI
    runs-on: ubuntu-latest
    needs: [test, build-python, release]
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        
      - name: 📥 Download Python packages
        uses: actions/download-artifact@v3
        with:
          name: python-packages
          path: dist/
          
      - name: 📦 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
